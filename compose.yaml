services:
  web:
    build:
      context: ~/Sites/Hotel
      args:
        - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
        # Exported by deploy.sh from the invoking account; see the dockerfile.
        - APP_UID=${APP_UID:-1000}
        - APP_GID=${APP_GID:-1000}
    container_name: hotel_app
    ports:
      - "8443:80"
    volumes:
      - ~/Sites/Hotel:/home/app/webapp
      - bundle_cache:/home/app/webapp/vendor/bundle
    environment:
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      # The public domain, without scheme (e.g. hotelmesondelbosque.com).
      # Every canonical/hreflang/Open Graph URL and the sitemap are built
      # from this, so search engines index one host instead of whatever the
      # Host header happens to say. Until it is set, robots.txt answers
      # "Disallow: /" and the site stays out of the index on purpose — which
      # is what you want for a staging deploy, and what you must change on
      # the day the real site goes live.
      - SITE_HOST=${SITE_HOST}
    restart: unless-stopped

volumes:
  bundle_cache: