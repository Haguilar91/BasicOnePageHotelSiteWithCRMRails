services:
  web:
    build:
      context: ~/Sites/Hotel
      args:
        - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    container_name: hotel_app
    ports:
      - "8443:80"
    volumes:
      - ~/Sites/Hotel:/home/app/webapp
    environment:
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    restart: unless-stopped