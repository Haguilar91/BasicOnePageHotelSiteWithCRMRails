services:
  web:
    build:
      context: ~/Sites/Hotel
      args:
        - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
        # Exported by deploy.sh from the invoking account; see the dockerfile.
        - APP_UID=${APP_UID:-1000}
        - APP_GID=${APP_GID:-1000}
    container_name: hotel_app
    ports:
      - "8443:80"
    volumes:
      - ~/Sites/Hotel:/home/app/webapp
      - bundle_cache:/home/app/webapp/vendor/bundle
    environment:
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      # The public domain, without a scheme. Defaults to
      # hotelmesondelbosque.com.mx (config/initializers/site_host.rb); every
      # canonical/hreflang/Open Graph URL and the sitemap follow it.
      #
      #   Pre-launch, on hotelmesondelbosque.hectoraguilar.dev:
      #     SITE_HOST=hotelmesondelbosque.hectoraguilar.dev
      #     ALLOW_INDEXING=false
      #
      #   At launch, once hotelmesondelbosque.com.mx points here:
      #     unset both — the defaults are already the live configuration.
      - SITE_HOST=${SITE_HOST:-}
      # Set to "false" to keep a deploy out of search results even when it is
      # answering on its canonical domain — the pre-launch hold. Any other
      # value (or unset) leaves the normal rule in charge: crawlers are let
      # in only while the site is answering on its own domain, so a copy on
      # any other host stays unindexed by itself.
      - ALLOW_INDEXING=${ALLOW_INDEXING:-}
    restart: unless-stopped

volumes:
  bundle_cache: