server {
    listen 80;
    server_name localhost;
    root /home/app/webapp/public;

    # Passenger configuration
    passenger_enabled on;
    passenger_user app;
    passenger_ruby /usr/bin/ruby;
    
    # Rails asset caching rules
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}