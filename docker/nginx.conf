server {
    listen 80;
    server_name localhost;
    root /home/app/webapp/public;

    # Passenger configuration
    passenger_enabled on;
    passenger_user app;
    passenger_ruby /usr/bin/ruby;

    # Photo uploads from the Avo admin (a room gallery is several files in one
    # POST). nginx's built-in default is only 1m, which a multi-photo save
    # blows past — it answers 413 and the upload dies. The client-side pass in
    # avo_image_compression.js gets a typical batch well under this, but the
    # headroom matters for anything it can't compress (e.g. HEIC, or a PNG with
    # real transparency, both of which are passed through untouched).
    client_max_body_size 50m;

    # Default is 60s *between reads*; a weak uplink on a large body can trip it.
    client_body_timeout 300s;

    # Rails asset caching rules
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}